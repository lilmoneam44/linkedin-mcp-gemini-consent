<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Authorize LinkedIn MCP</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { --surface: #fff; --text: #17212b; --muted: #566575; --border: #d5dce3; --soft: #e9edf2; --error: #a32121; margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; background: #f4f6f8; color: var(--text); }
      main { width: min(100%, 36rem); padding: clamp(1.25rem, 5vw, 2rem); background: var(--surface); border: 1px solid var(--border); border-radius: 1rem; box-shadow: 0 1rem 3rem #17212b18; }
      @media (prefers-color-scheme: dark) { body { --surface: #171b21; --text: #f1f4f8; --muted: #aab6c3; --border: #343d48; --soft: #29313b; --error: #ff8e8e; background: #0f1216; } }
      h1 { margin-top: 0; font-size: 1.5rem; }
      p { line-height: 1.55; }
      .muted { color: var(--muted); font-size: .95rem; }
      .error { color: var(--error); }
      button { min-height: 2.75rem; padding: .7rem 1rem; border: 0; border-radius: .5rem; font: inherit; cursor: pointer; }
      button:focus-visible { outline: 3px solid #80b7ff; outline-offset: 3px; }
      button:disabled { cursor: wait; opacity: .65; }
      .primary { background: #0969da; color: white; }
      .secondary { background: var(--soft); color: var(--text); margin-inline-start: .5rem; }
      #actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1.5rem; }
      #language { float: inline-end; margin: -.5rem -.5rem 1rem 1rem; background: var(--soft); color: var(--text); }
      #details { overflow-wrap: anywhere; }
      [hidden] { display: none !important; }
    </style>
    <script src="../../config.js"></script>
  </head>
  <body>
    <main>
      <button id="language" type="button" aria-label="Switch language">العربية</button>
      <h1 id="heading">Authorize LinkedIn MCP</h1>
      <p id="status" class="muted" aria-live="polite">Checking the authorization request…</p>
      <section id="details" hidden>
        <p id="client"></p>
        <p id="scopes" class="muted"></p>
        <p id="approval-note" class="muted">Approving lets this signed-in account use the LinkedIn tools. A LinkedIn post still requires the tool's separate confirmation step.</p>
      </section>
      <div id="actions" hidden>
        <button id="approve" class="primary" type="button">Approve access</button>
        <button id="deny" class="secondary" type="button">Deny</button>
      </div>
      <button id="sign-in" class="primary" type="button" hidden>Sign in with GitHub</button>
    </main>
    <script type="module">
      import { createClient } from "https://esm.sh/@supabase/supabase-js@2.119.0";

      const config = window.LINKEDIN_MCP_CONFIG;
      const status = document.querySelector("#status");
      const signInButton = document.querySelector("#sign-in");
      const detailsPanel = document.querySelector("#details");
      const actions = document.querySelector("#actions");
      const languageButton = document.querySelector("#language");
      const copy = {
        en: {
          heading: "Authorize LinkedIn MCP", loading: "Checking the authorization request…",
          signInPrompt: "Sign in with the allowed GitHub account to review this request.",
          signIn: "Sign in with GitHub", notAllowed: "This GitHub account is not allowed to authorize the LinkedIn MCP server.",
          review: "Review the request before approving.", approve: "Approve access", deny: "Deny",
          approvalNote: "Approving lets this signed-in account use the LinkedIn tools. A LinkedIn post still requires the tool's separate confirmation step.",
          switch: "العربية", scopes: "Requested scopes: ",
        },
        ar: {
          heading: "السماح بالاتصال بخادم LinkedIn MCP", loading: "جارٍ التحقق من طلب التفويض…",
          signInPrompt: "سجّل الدخول بحساب GitHub المسموح لمراجعة الطلب.",
          signIn: "تسجيل الدخول عبر GitHub", notAllowed: "حساب GitHub ده مش مسموح له باستخدام خادم LinkedIn MCP.",
          review: "راجع الطلب قبل الموافقة.", approve: "موافقة", deny: "رفض",
          approvalNote: "الموافقة تسمح لهذا الحساب باستخدام أدوات LinkedIn. نشر أي بوست يحتاج تأكيداً منفصلاً من الأداة.",
          switch: "English", scopes: "الصلاحيات المطلوبة: ",
        },
      };
      let currentLanguage = "en";

      function setLanguage(language) {
        currentLanguage = language;
        const t = copy[language];
        document.documentElement.lang = language;
        document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
        document.querySelector("#heading").textContent = t.heading;
        document.querySelector("#approval-note").textContent = t.approvalNote;
        document.querySelector("#approve").textContent = t.approve;
        document.querySelector("#deny").textContent = t.deny;
        signInButton.textContent = t.signIn;
        languageButton.textContent = t.switch;
        languageButton.setAttribute("aria-label", language === "ar" ? "تغيير اللغة إلى الإنجليزية" : "Switch language");
        if (!status.classList.contains("error")) status.textContent = t.loading;
      }

      languageButton.addEventListener("click", () => setLanguage(currentLanguage === "en" ? "ar" : "en"));
      setLanguage("en");
      const authorizationId = new URL(location.href).searchParams.get("authorization_id");
      let supabase;

      function showError(message) {
        status.textContent = message;
        status.classList.add("error");
      }

      if (!config?.supabaseUrl || !config?.supabasePublishableKey || !authorizationId) {
        showError("Consent page is missing its Supabase settings or authorization request.");
      } else {
        supabase = createClient(config.supabaseUrl, config.supabasePublishableKey, {
          auth: { flowType: "pkce", detectSessionInUrl: true, persistSession: true },
        });
        await initialize();
      }

      async function initialize() {
        const { data: { user }, error } = await supabase.auth.getUser();
        if (error || !user) {
          status.textContent = copy[currentLanguage].signInPrompt;
          signInButton.hidden = false;
          signInButton.addEventListener("click", signIn);
          return;
        }

        const ownerIdentity = user.identities?.find((identity) =>
          identity.provider === "github" &&
          String(identity.provider_id ?? identity.id) === String(config.allowedGithubProviderId)
        );
        if (!ownerIdentity) {
          showError(copy[currentLanguage].notAllowed);
          return;
        }

        const { data, error: detailsError } = await supabase.auth.oauth.getAuthorizationDetails(authorizationId);
        if (detailsError || !data) {
          showError(detailsError?.message || "Could not load the OAuth request.");
          return;
        }
        if (data.redirect_url) {
          location.replace(data.redirect_url);
          return;
        }

        const clientName = data.client?.name || data.client_name || "Connected AI app";
        const requestedScopes = data.scope || data.scopes?.join(" ") || "No additional scopes listed";
        document.querySelector("#client").textContent = `${clientName} is requesting access to this MCP server.`;
        document.querySelector("#scopes").textContent = `${copy[currentLanguage].scopes}${requestedScopes}`;
        status.textContent = copy[currentLanguage].review;
        detailsPanel.hidden = false;
        actions.hidden = false;
        document.querySelector("#approve").addEventListener("click", () => decide(true), { once: true });
        document.querySelector("#deny").addEventListener("click", () => decide(false), { once: true });
      }

      async function signIn() {
        signInButton.disabled = true;
        const redirectTo = `${location.origin}${location.pathname}${location.search}`;
        const { error } = await supabase.auth.signInWithOAuth({
          provider: "github",
          options: { redirectTo },
        });
        if (error) {
          signInButton.disabled = false;
          showError(error.message);
        }
      }

      async function decide(approved) {
        const buttons = [...actions.querySelectorAll("button")];
        buttons.forEach((button) => button.disabled = true);
        status.textContent = approved
          ? (currentLanguage === "ar" ? "جارٍ الموافقة…" : "Approving access…")
          : (currentLanguage === "ar" ? "جارٍ الرفض…" : "Denying access…");
        const result = approved
          ? await supabase.auth.oauth.approveAuthorization(authorizationId)
          : await supabase.auth.oauth.denyAuthorization(authorizationId);
        if (result.error || !result.data?.redirect_url) {
          buttons.forEach((button) => button.disabled = false);
          showError(result.error?.message || "Supabase did not return a redirect URL.");
          return;
        }
        location.assign(result.data.redirect_url);
      }
    </script>
  </body>
</html>
